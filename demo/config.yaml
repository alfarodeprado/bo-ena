# Demo configuration for ENflorA.
#
# Used automatically when any script is called with --demo.
# Submits bundled dummy data to the ENA TEST server so users can
# verify their setup (credentials, Java, Webin-CLI) works end-to-end
# without preparing real data first.
#
# All paths are relative to the script's working directory,
# i.e. biosamples/, runs/, or analysis/.

credentials: ../credentials.txt
jar: ../webin-cli-8.2.0.jar

data_biosamples: ../demo/DemoBiosampleList.xlsx
data_runs:       ../demo/DemoExperimentList.xlsx
data_analysis:   ../demo/DemoAnalysisList.xlsx

# The ENA sample checklist to validate the demo samples against. The demo table
# follows the plant checklist that ships with ENflorA; point this at another
# checklist XML (and use a matching table) to try a different one.
checklist: ../biosamples/ERC000037.xml

# Set up house settings, like in the main config, so the demo table behaves like a real one.
extra_mandatory:
  - bio_material
  - altitude

# Set default values for any missing columns in the demo table. These are used to fill in the demo table's empty cells, so that the demo submission passes validation.
defaults:
  plant growth medium: soil

# Set up column aliases to match the demo table's headers to the ENA sample checklist's expected names.
column_aliases:
  latitude:  geographic location (latitude)
  longitude: geographic location (longitude)
  country:   geographic location (country and/or sea)
  locality:  geographic location (region and locality)
  region:    geographic location (region and locality)

# Always submit, never live, so that the demo data goes to the test server only.
submit: True
live:   False

# Keep demo outputs separate from real submission files.
sub_dir_biosamples: demo_submission
sub_dir_runs:       demo_submission
sub_dir_analysis:   demo_submission

# Analysis-specific (the demo FASTA is a single contig).
assembly_level: contig
